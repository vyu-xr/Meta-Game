<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Game Prototype</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            /* Prevent scrolling and pinch-zoom on mobile */
            touch-action: none;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Joystick overlay */
        #joystick-zone {
            position: absolute;
            bottom: 115px;
            left: 20px;
            width: 150px;
            height: 150px;
            z-index: 10;
        }
        /* Dash Button overlay */
        #dash-button {
            position: absolute;
            bottom: 60px;
            right: 20px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            border: 4px solid white;
            color: white;
            font-size: 20px;
            font-family: sans-serif;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            /* Ensure fast tap response */
            touch-action: manipulation;
        }
        #dash-button:active {
            background-color: rgba(255, 255, 255, 0.8);
            transform: scale(0.95);
        }
        /* Slash Button overlay */
        #slash-button {
            position: absolute;
            bottom: 150px;
            right: 20px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: rgba(255, 100, 100, 0.5);
            border: 4px solid white;
            color: white;
            font-size: 16px;
            font-family: sans-serif;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            touch-action: manipulation;
        }
        #slash-button:active {
            background-color: rgba(255, 100, 100, 0.8);
            transform: scale(0.95);
        }
        /* Simple HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: sans-serif;
            font-size: 16px;
            z-index: 10;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }
        #map-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(3, 2, 4, 0.78);
            z-index: 30;
            touch-action: none;
        }
        #map-overlay.open {
            display: flex;
        }
        #map-frame {
            position: relative;
            width: min(100vw, 56.25vh);
            height: min(177.78vw, 100vh);
            max-width: 1080px;
            max-height: 1920px;
            overflow: hidden;
            background: #080305;
        }
        #map-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .map-node {
            position: absolute;
            width: 74px;
            height: 74px;
            transform: translate(-50%, -50%);
            padding: 0;
            border: 0;
            background: transparent;
            color: transparent;
            z-index: 4;
            touch-action: manipulation;
        }
        .map-indicator,
        .map-indicator-fill {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
            background: var(--map-indicator-color, rgba(1, 1, 2, 0.92));
            mask-repeat: no-repeat;
            mask-position: center;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            -webkit-mask-size: contain;
        }
        .map-indicator {
            width: 30px;
            height: 30px;
            z-index: 2;
            opacity: 0.82;
            transform: translate(-50%, -50%) scale(1.28);
            mask-image: url('assets/environment/map indicator fill.png');
            -webkit-mask-image: url('assets/environment/map indicator fill.png');
        }
        .map-indicator-fill {
            width: 25px;
            height: 25px;
            z-index: 3;
            display: none;
            --map-indicator-color: #c9fbff;
            filter: drop-shadow(0 0 6px rgba(201, 251, 255, 0.78)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.65));
            mask-image: url('assets/environment/map indicator fill.png');
            -webkit-mask-image: url('assets/environment/map indicator fill.png');
        }
        .map-indicator-fill.active {
            display: block;
        }
        #map-close {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.75);
            background: rgba(0,0,0,0.45);
            color: white;
            font-size: 24px;
            z-index: 3;
            touch-action: manipulation;
        }
        #scene-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 18;
            opacity: 0;
            background: radial-gradient(circle at 50% 47%, rgba(0, 0, 0, 0) 36%, rgba(44, 0, 10, 0.28) 68%, rgba(0, 0, 0, 0.58) 100%);
            transition: opacity 0.4s ease;
        }
        #scene-vignette.ritual-active {
            opacity: 1;
        }
        #fade-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 70;
            transition: opacity 0.38s ease;
        }
        #fade-overlay.active {
            opacity: 1;
        }
        #map-overlay {
            background: #000;
        }
        #map-overlay.open #map-frame {
            animation: mapEnter 0.48s cubic-bezier(.16, .86, .28, 1) both;
        }
        #map-frame.departing {
            animation: mapDepart 0.36s ease both;
        }
        #map-overlay.open .map-indicator {
            animation: indicatorBackPop 0.34s cubic-bezier(.2, 1.35, .28, 1) 0.26s both;
        }
        #map-overlay.open .map-indicator-fill.active {
            animation: indicatorPop 0.34s cubic-bezier(.2, 1.35, .28, 1) 0.26s both;
        }
        .map-indicator-fill.travel-selected {
            display: block;
            animation: indicatorSelect 0.42s ease both;
        }
        @keyframes mapEnter {
            from { opacity: 0; transform: scale(1.16); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes mapDepart {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(1.18); }
        }
        @keyframes indicatorBackPop {
            from { opacity: 0; transform: translate(-50%, -50%) scale(1.9); }
            to { opacity: 0.82; transform: translate(-50%, -50%) scale(1.28); }
        }
        @keyframes indicatorPop {
            from { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes indicatorSelect {
            from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1.65); }
        }
    </style>
</head>
<body>
    <div id="hud">
        Move with Joystick, DASH & SLASH!<br>
        <span id="base-health-display" style="color: #ffcccc; font-weight: bold;">Base Health: 100</span><br>
        <span id="soul-health-display" style="color: #cde9ff; font-weight: bold;">Soul Health: 100</span><br>
        <span id="soul-coin-display" style="color: #ffe3a3; font-weight: bold;">Soul Coins: 0</span>
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="map-overlay" aria-hidden="true">
        <div id="map-frame">
            <img id="map-image" src="assets/environment/lock two places.jpg" alt="Travel map">
            <button id="map-close" type="button">x</button>
            <span class="map-indicator" style="left: 55%; top: 73%;"></span>
            <span class="map-indicator-fill" data-location="shop" style="left: 55%; top: 73%;"></span>
            <button class="map-node" data-destination="shop" type="button" aria-label="Travel to shop" style="left: 55%; top: 73%;">SHOP</button>
            <span class="map-indicator" style="left: 82%; top: 46.3%;"></span>
            <span class="map-indicator-fill" data-location="circus" style="left: 82%; top: 46.3%;"></span>
            <button class="map-node" data-destination="circus" type="button" aria-label="Travel to circus" style="left: 82%; top: 46.3%;">CIRCUS</button>
            <span class="map-indicator" style="left: 55%; top: 52%;"></span>
            <span class="map-indicator-fill active" data-location="home" style="left: 55%; top: 52%;"></span>
            <button class="map-node" data-destination="home" type="button" aria-label="Travel home" style="left: 55%; top: 52%;">HOME</button>
        </div>
    </div>
    <div id="scene-vignette" class="ritual-active"></div>
    <div id="fade-overlay"></div>
    <!-- Zone for nipple.js to bind to -->
    <div id="joystick-zone"></div>
    <div id="dash-button">DASH</div>
    <div id="slash-button">SLASH</div>

    <!-- Local dependencies inside vendor folder to avoid network requests -->
    <script src="vendor/three.min.js"></script>
    <script src="vendor/nipplejs.min.js"></script>
    
    <script>
        // --- 1. Basic Setup ---
        const canvas = document.getElementById('game-canvas');
        
        const scene = new THREE.Scene();

        const createBackgroundTexture = (areaName = 'basement') => {
            const bgCanvas = document.createElement('canvas');
            bgCanvas.width = Math.max(512, window.innerWidth);
            bgCanvas.height = Math.max(512, window.innerHeight);
            const bgCtx = bgCanvas.getContext('2d');
            const radius = Math.max(bgCanvas.width, bgCanvas.height) * 0.6;
            const gradient = bgCtx.createRadialGradient(
                bgCanvas.width * 0.5,
                bgCanvas.height * 0.45,
                0,
                bgCanvas.width * 0.5,
                bgCanvas.height * 0.45,
                radius
            );

            if (areaName === 'lobby') {
                gradient.addColorStop(0, '#3a3a3a');
                gradient.addColorStop(0.55, '#202020');
                gradient.addColorStop(1, '#070707');
            } else {
                gradient.addColorStop(0, '#2a0508');
                gradient.addColorStop(0.55, '#100103');
                gradient.addColorStop(1, '#010000');
            }

            bgCtx.fillStyle = gradient;
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            const texture = new THREE.CanvasTexture(bgCanvas);
            texture.minFilter = THREE.LinearFilter;
            return texture;
        };

        scene.background = createBackgroundTexture('basement');
        
        const getAdaptiveCameraFov = () => {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 0.55) return 36;
            if (aspect < 0.75) return 34;
            return 32;
        };

        const camera = new THREE.PerspectiveCamera(getAdaptiveCameraFov(), window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18.7, 13.2);
        
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));


        // --- 3. Character (2D Sprite Billboard) ---
        const soulTexture = new THREE.TextureLoader().load('assets/character/soul-hero.png');
        soulTexture.minFilter = THREE.LinearFilter;

        const soulHeight = 1.26;
        const soulWidth = soulHeight * (373 / 704);
        const charGeometry = new THREE.PlaneGeometry(soulWidth, soulHeight);
        const charMaterial = new THREE.MeshBasicMaterial({
            map: soulTexture,
            transparent: true,
            alphaTest: 0.1,
            side: THREE.DoubleSide
        });

        let characterFacing = 1;
        let soulAnimTime = 0;
        let slashPoseTimer = 0;
        const slashPoseDuration = 0.18;
        let slashPoseDir = { x: 1, z: 0 };
        // Group to hold both shadow and character
        const characterGroup = new THREE.Group();
        characterGroup.position.set(2.65, 0, 1.01);
        
        const character = new THREE.Mesh(charGeometry, charMaterial);
        character.position.y = 1; // Elevate so it sits on floor
        characterGroup.add(character);

        // Add a blob drop shadow to anchor it in 2.5D space
        const shadowGeo = new THREE.PlaneGeometry(1.5, 0.6);
        const shadowMat = new THREE.MeshBasicMaterial({ 
            color: 0x000000, 
            transparent: true, 
            opacity: 0.4 
        });
        const dropShadow = new THREE.Mesh(shadowGeo, shadowMat);
        dropShadow.rotation.x = -Math.PI / 2;
        dropShadow.position.y = 0.01; // Slightly above ground
        characterGroup.add(dropShadow);

        scene.add(characterGroup);

        const sleepingTexture = new THREE.TextureLoader().load('assets/character/sleep character.png');
        sleepingTexture.minFilter = THREE.LinearFilter;

        const sleepingBodyHeight = 2.55;
        const sleepingBodyWidth = sleepingBodyHeight * (433 / 650);
        const sleepingBody = new THREE.Mesh(
            new THREE.PlaneGeometry(sleepingBodyWidth, sleepingBodyHeight),
            new THREE.MeshBasicMaterial({
                map: sleepingTexture,
                transparent: true,
                alphaTest: 0.1,
                side: THREE.DoubleSide
            })
        );
        sleepingBody.position.set(0, 0.08, 1.011);
        sleepingBody.rotation.x = -Math.PI / 2;
        scene.add(sleepingBody);
        // --- 4. Lighting ---
        // Since we use MeshBasicMaterial, lights aren't strictly necessary, but kept for future 3D elements
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        // --- 4.1 Blender Base Layout ---
        const baseGroundTexture = new THREE.TextureLoader().load('assets/environment/base ground texture.jpg');
        baseGroundTexture.minFilter = THREE.LinearFilter;
        baseGroundTexture.wrapS = THREE.RepeatWrapping;
        baseGroundTexture.wrapT = THREE.RepeatWrapping;

        const layoutMaterials = {
            Ground: new THREE.MeshBasicMaterial({ color: 0x26352d, side: THREE.DoubleSide }),
            BaseCircle: new THREE.MeshBasicMaterial({ color: 0x55aaff, side: THREE.DoubleSide }),
            CandleMarker: new THREE.MeshBasicMaterial({ color: 0xffbd40, side: THREE.DoubleSide }),
            StoneMarker: new THREE.MeshBasicMaterial({ color: 0x40a2ff, side: THREE.DoubleSide }),
            RitualRing: new THREE.LineBasicMaterial({ color: 0x7dd5ee }),
            BodyProtect: new THREE.MeshBasicMaterial({ color: 0xeadfd5, side: THREE.DoubleSide }),
            BaseGround: new THREE.MeshBasicMaterial({ map: baseGroundTexture, side: THREE.DoubleSide }),
            HouseBase: new THREE.MeshBasicMaterial({ color: 0x4a302d, side: THREE.DoubleSide }),
            ShopSand: new THREE.MeshBasicMaterial({ color: 0xb88f64, side: THREE.DoubleSide }),
            CircusGround: new THREE.MeshBasicMaterial({ color: 0x6f4a68, side: THREE.DoubleSide }),
            Default: new THREE.MeshBasicMaterial({ color: 0xb8c7bd, side: THREE.DoubleSide })
        };
        const objLayoutScale = 1;
        const basementGroup = new THREE.Group();
        basementGroup.name = 'BasementScene';
        const lobbyGroup = new THREE.Group();
        lobbyGroup.name = 'HomeLobbyScene';
        lobbyGroup.visible = false;
        const shopGroup = new THREE.Group();
        shopGroup.name = 'ShopBeachScene';
        shopGroup.visible = false;
        const circusGroup = new THREE.Group();
        circusGroup.name = 'CircusScene';
        circusGroup.visible = false;
        scene.add(basementGroup);
        scene.add(lobbyGroup);
        scene.add(shopGroup);
        scene.add(circusGroup);
        let activeArea = 'basement';
        let lobbyReady = false;
        let shopReady = false;
        let circusReady = false;

        const getLayoutMaterial = (objectData, isLine = false, sceneStyle = 'default') => {
            const name = objectData.name.toLowerCase();
            const materialName = objectData.material;

            if (name.includes('base_ground') || name.includes('base_underground') || name.includes('basement_ritual_ground') || name.includes('basefbxasc032offbxasc032house')) return layoutMaterials.BaseGround;
            if (sceneStyle === 'shop' && (name === 'base' || name === 'base2' || name.includes('shop_beach'))) return layoutMaterials.ShopSand;
            if (sceneStyle === 'circus' && (name === 'base' || name === 'plane' || name.includes('circus'))) return layoutMaterials.CircusGround;
            if (name.includes('ground')) return layoutMaterials.Ground;
            if (name.includes('base_circle')) return layoutMaterials.BaseCircle;
            if (name.includes('candle')) return layoutMaterials.CandleMarker;
            if (name.includes('stone')) return layoutMaterials.StoneMarker;
            if (name.includes('ring')) return layoutMaterials.RitualRing;
            if (name.includes('house_base') || name.includes('base_of_house') || name.includes('base of house')) return layoutMaterials.HouseBase;
            if (name.includes('body') || name.includes('protect')) return layoutMaterials.BodyProtect;

            return layoutMaterials[materialName] || (isLine ? layoutMaterials.RitualRing : layoutMaterials.Default);
        };

        const addFallbackBaseLayout = () => {
            const homeGroundGeo = new THREE.PlaneGeometry(24, 24);
            const homeGround = new THREE.Mesh(homeGroundGeo, layoutMaterials.Ground);
            homeGround.rotation.x = -Math.PI / 2;
            homeGround.position.y = -0.01;
            scene.add(homeGround);

            const baseGeo = new THREE.CircleGeometry(3, 32);
            const baseMesh = new THREE.Mesh(baseGeo, layoutMaterials.BaseCircle);
            baseMesh.rotation.x = -Math.PI / 2;
            baseMesh.position.y = 0.05;
            scene.add(baseMesh);
        };

        const addObjLayoutToScene = (objText, targetGroup = scene, sceneStyle = 'default') => {
            const vertices = [];
            const texcoords = [];
            let currentObject = null;
            let currentMaterial = 'Default';
            const objects = [];

            const ensureObject = () => {
                if (!currentObject) {
                    currentObject = { name: 'OBJ_object', material: currentMaterial, faces: [], uvs: [], lines: [] };
                    objects.push(currentObject);
                }
                return currentObject;
            };

            const parseVertexIndex = (token) => {
                const rawIndex = parseInt(token.split('/')[0], 10);
                return rawIndex < 0 ? vertices.length + rawIndex : rawIndex - 1;
            };

            const parseObjToken = (token) => {
                const values = token.split('/');
                const vertexIndex = parseInt(values[0], 10);
                const uvIndex = values[1] ? parseInt(values[1], 10) : 0;
                return {
                    vertex: vertexIndex < 0 ? vertices.length + vertexIndex : vertexIndex - 1,
                    uv: uvIndex ? (uvIndex < 0 ? texcoords.length + uvIndex : uvIndex - 1) : null
                };
            };

            objText.split(/\r?\n/).forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) return;

                const parts = trimmed.split(/\s+/);
                const type = parts[0];

                if (type === 'o' || type === 'g') {
                    currentObject = { name: parts.slice(1).join(' ') || 'OBJ_object', material: currentMaterial, faces: [], uvs: [], lines: [] };
                    objects.push(currentObject);
                    return;
                }

                if (type === 'usemtl') {
                    currentMaterial = parts[1] || 'Default';
                    ensureObject().material = currentMaterial;
                    return;
                }

                if (type === 'v') {
                    vertices.push(new THREE.Vector3(parseFloat(parts[1]) * objLayoutScale, parseFloat(parts[2]) * objLayoutScale, parseFloat(parts[3]) * objLayoutScale));
                    return;
                }

                if (type === 'vt') {
                    texcoords.push({ u: parseFloat(parts[1]), v: parseFloat(parts[2]) });
                    return;
                }

                if (type === 'f') {
                    const tokens = parts.slice(1).map(parseObjToken);
                    for (let i = 1; i < tokens.length - 1; i++) {
                        const triangle = [tokens[0], tokens[i], tokens[i + 1]];
                        const object = ensureObject();
                        triangle.forEach((token) => object.faces.push(token.vertex));
                        if (triangle.every((token) => token.uv !== null)) {
                            triangle.forEach((token) => object.uvs.push(token.uv));
                        }
                    }
                    return;
                }

                if (type === 'l') {
                    const indices = parts.slice(1).map(parseVertexIndex);
                    for (let i = 0; i < indices.length - 1; i++) {
                        ensureObject().lines.push(indices[i], indices[i + 1]);
                    }
                }
            });

            objects.forEach((objectData) => {
                const objectName = objectData.name.toLowerCase();
                if (objectName.includes('body') || objectName.includes('protect') || objectName.includes('disable') || objectName.includes('dissable')) return;

                if (objectData.faces.length > 0) {
                    const positions = [];
                    objectData.faces.forEach((index) => {
                        const vertex = vertices[index];
                        positions.push(vertex.x, vertex.y, vertex.z);
                    });

                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                    if (objectData.uvs.length === objectData.faces.length) {
                        const uvs = [];
                        objectData.uvs.forEach((index) => {
                            const uv = texcoords[index];
                            uvs.push(uv.u, uv.v);
                        });
                        geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                    }
                    geometry.computeVertexNormals();

                    const material = getLayoutMaterial(objectData, false, sceneStyle);
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.name = objectData.name;
                    targetGroup.add(mesh);
                }

                if (objectData.lines.length > 0) {
                    const positions = [];
                    objectData.lines.forEach((index) => {
                        const vertex = vertices[index];
                        positions.push(vertex.x, vertex.y, vertex.z);
                    });

                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

                    const material = getLayoutMaterial(objectData, true, sceneStyle);
                    const lineSegments = new THREE.LineSegments(geometry, material);
                    lineSegments.name = objectData.name;
                    targetGroup.add(lineSegments);
                }
            });
        };


        const createGeneratedRitualRing = (targetGroup = scene) => {
            const positions = [];
            const radius = 2.13;
            const centerZ = 1.011;
            const segments = 32;
            for (let i = 0; i < segments; i++) {
                const a = (i / segments) * Math.PI * 2;
                const b = ((i + 1) / segments) * Math.PI * 2;
                positions.push(Math.cos(a) * radius, 0.03, centerZ + Math.sin(a) * radius);
                positions.push(Math.cos(b) * radius, 0.03, centerZ + Math.sin(b) * radius);
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const ring = new THREE.LineSegments(geometry, layoutMaterials.RitualRing);
            ring.name = 'RITUAL_ring_radius_5_generated';
            targetGroup.add(ring);
        };

        const addGlbLayoutToScene = (arrayBuffer, targetGroup = scene) => {
            const bytes = new Uint8Array(arrayBuffer);
            const view = new DataView(arrayBuffer);
            const magic = String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]);
            if (magic !== 'glTF') throw new Error('Invalid GLB file');

            const jsonLength = view.getUint32(12, true);
            const jsonType = String.fromCharCode(bytes[16], bytes[17], bytes[18], bytes[19]);
            if (jsonType !== 'JSON') throw new Error('Missing GLB JSON chunk');

            const jsonText = new TextDecoder().decode(bytes.slice(20, 20 + jsonLength)).trim();
            const gltf = JSON.parse(jsonText);

            let offset = 20 + jsonLength;
            let binaryChunk = null;
            while (offset < bytes.length) {
                const chunkLength = view.getUint32(offset, true);
                const chunkType = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
                if (chunkType === 'BIN\0') {
                    binaryChunk = arrayBuffer.slice(offset + 8, offset + 8 + chunkLength);
                    break;
                }
                offset += 8 + chunkLength;
            }
            if (!binaryChunk) throw new Error('Missing GLB binary chunk');

            const componentReaders = {
                5121: { size: 1, read: (dv, at) => dv.getUint8(at) },
                5123: { size: 2, read: (dv, at) => dv.getUint16(at, true) },
                5125: { size: 4, read: (dv, at) => dv.getUint32(at, true) },
                5126: { size: 4, read: (dv, at) => dv.getFloat32(at, true) }
            };
            const typeSizes = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4 };

            const readAccessor = (accessorIndex) => {
                const accessor = gltf.accessors[accessorIndex];
                const bufferView = gltf.bufferViews[accessor.bufferView];
                const reader = componentReaders[accessor.componentType];
                const itemSize = typeSizes[accessor.type];
                const stride = bufferView.byteStride || reader.size * itemSize;
                const start = (bufferView.byteOffset || 0) + (accessor.byteOffset || 0);
                const dataView = new DataView(binaryChunk);
                const values = [];

                for (let i = 0; i < accessor.count; i++) {
                    for (let c = 0; c < itemSize; c++) {
                        values.push(reader.read(dataView, start + i * stride + c * reader.size));
                    }
                }

                return { values, itemSize, componentType: accessor.componentType };
            };

            const makeIndexArray = (indices) => {
                if (!indices) return null;
                if (indices.componentType === 5125) return new Uint32Array(indices.values);
                return new Uint16Array(indices.values);
            };

            const nodes = gltf.nodes || [];
            const sceneNodes = gltf.scenes?.[gltf.scene || 0]?.nodes || nodes.map((_, index) => index);
            let generatedRing = false;

            sceneNodes.forEach((nodeIndex) => {
                const node = nodes[nodeIndex];
                const nodeName = node.name || '';
                const objectName = nodeName.toLowerCase();

                if (objectName.includes('body') || objectName.includes('protect') || objectName.includes('disable') || objectName.includes('dissable')) return;

                if (objectName.includes('ring') && node.mesh === undefined) {
                    createGeneratedRitualRing();
                    generatedRing = true;
                    return;
                }

                if (node.mesh === undefined) return;
                const meshDef = gltf.meshes[node.mesh];

                meshDef.primitives.forEach((primitive) => {
                    if (primitive.mode !== undefined && primitive.mode !== 4) return;

                    const positionAccessor = readAccessor(primitive.attributes.POSITION);
                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positionAccessor.values, positionAccessor.itemSize));

                    if (primitive.indices !== undefined) {
                        geometry.setIndex(new THREE.BufferAttribute(makeIndexArray(readAccessor(primitive.indices)), 1));
                    }

                    if (primitive.attributes.NORMAL !== undefined) {
                        const normalAccessor = readAccessor(primitive.attributes.NORMAL);
                        geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normalAccessor.values, normalAccessor.itemSize));
                    } else {
                        geometry.computeVertexNormals();
                    }

                    const materialName = primitive.material !== undefined ? gltf.materials?.[primitive.material]?.name : '';
                    const material = getLayoutMaterial({ name: nodeName || meshDef.name || '', material: materialName });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.name = nodeName || meshDef.name || 'GLB_mesh';

                    if (node.translation) mesh.position.fromArray(node.translation);
                    if (node.rotation) mesh.quaternion.fromArray(node.rotation);
                    if (node.scale) mesh.scale.fromArray(node.scale);

                    targetGroup.add(mesh);
                });
            });

            }
            
            scene.add(enemyGroup);
            enemies.push({ type: ghostType, group: enemyGroup, mesh: enemyMesh, areaTelegraph, hp: ghostType.hp, state: 'chase', facing: 1, age: 0, zigzagPhase: Math.random() * Math.PI * 2, ritualHits: 0, windupTimer: 0, areaWindupTimer: 0, areaCooldownTimer: 0, attackCooldownTimer: 0, attackTimer: 0, stunTimer: 0, knockback: { x: 0, z: 0 } });
        };

        // --- 5. Joystick Controller ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystick = nipplejs.create({
            zone: joystickZone,
            mode: 'static',
            position: { left: '50%', top: '50%' },
            color: 'white',
            size: 120
        });

        // Store movement intentions
        let moveData = {
            forward: 0,
            turn: 0
        };

        joystick.on('move', (evt, data) => {
            const force = Math.min(data.force, 1);
            const angle = data.angle.radian;
            
            // NippleJS angles: 0 is right, PI/2 is up, PI is left, 3PI/2 is down
            // Map to 3D movement: 
            // Up -> move along -Z
            // Right -> move along +X
            moveData.forward = Math.sin(angle) * force;
            moveData.turn = Math.cos(angle) * force;
        });

        joystick.on('end', () => {
            moveData.forward = 0;
            moveData.turn = 0;
        });

        // --- 5.5 Dash & Slash Logic ---
        const dashBtn = document.getElementById('dash-button');
        const slashBtn = document.getElementById('slash-button');
        
        let isDashing = false;
        let dashTimer = 0;
        let comboStep = 0;
        let comboTimer = 0;
        const comboResetTime = 0.62;
        const slashRecoveryTime = 0.2;
        let slashRecoveryTimer = 0;
        let lastMoveDir = { turn: 0, forward: -1 }; 

        const updateLastMoveDir = () => {
            if (moveData.turn !== 0 || moveData.forward !== 0) {
                const mag = Math.sqrt(moveData.turn * moveData.turn + moveData.forward * moveData.forward);
                lastMoveDir.turn = moveData.turn / mag;
                lastMoveDir.forward = moveData.forward / mag;
            }
        };

        const triggerDash = (e) => {
            e.preventDefault();
            if (!isDashing) {
                isDashing = true; dashTimer = 0.2; updateLastMoveDir();
            }
        };

        const destroyEnemy = (enemy, index, awardCoins = true) => {
            if (awardCoins) {
                soulCoins += enemy.type.coinValue || 1;
                updateHealthDisplays();
            }
            scene.remove(enemy.group);
            enemy.mesh.material.dispose();
            if (enemy.areaTelegraph) enemy.areaTelegraph.material.dispose();
            enemies.splice(index, 1);
        };

        const damageEnemy = (enemy, index, slashDir, damage, knockbackPower) => {
            enemy.hp -= damage;
            const isAreaLocked = enemy.state === 'playerAreaWindup' && enemy.type.uninterruptibleAreaAttack;
            const canRetaliate = enemy.hp > 0 && enemy.type.playerAreaTriggerRadius && enemy.areaCooldownTimer <= 0 && !isAreaLocked;
            const knockbackMultiplier = (isAreaLocked || canRetaliate) ? 0 : (enemy.type.knockbackMultiplier ?? 1);
            enemy.stunTimer = (isAreaLocked || canRetaliate) ? 0 : (enemy.type.stunDuration ?? 0.22);
            if (!isAreaLocked) {
                if (canRetaliate) {
                    enemy.state = 'playerAreaWindup';
                    enemy.areaWindupTimer = enemy.type.playerAreaWindupTime || 0.65;
                    enemy.windupTimer = 0;
                    enemy.attackTimer = 0;
                    enemy.attackCooldownTimer = 0;
                } else {
                    enemy.state = 'chase';
                    enemy.windupTimer = 0;
                    enemy.attackTimer = 0;
                    enemy.attackCooldownTimer = 0;
                }
            }
            enemy.knockback.x = slashDir.x * knockbackPower * knockbackMultiplier;
            enemy.knockback.z = slashDir.z * knockbackPower * knockbackMultiplier;
            enemy.mesh.material.color.setHex(canRetaliate ? 0xff9a9a : 0xffffff);
            createHitBurst(enemy.group.position);
            triggerScreenShake(comboStep === 3 ? 0.3 : 0.2, comboStep === 3 ? 0.15 : 0.11);

            if (enemy.hp <= 0) {
                destroyEnemy(enemy, index);
            }
        };

        const resolvePlayerEnemyCollision = () => {
            if (isDashing) return;

            const defaultBlockRadius = activeGhostType.contactRadius;
            enemies.forEach((enemy) => {
                const dx = characterGroup.position.x - enemy.group.position.x;
                const dz = characterGroup.position.z - enemy.group.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                const blockRadius = enemy.type?.contactRadius || defaultBlockRadius;
                if (dist >= blockRadius) return;

                const pushX = dist > 0.001 ? dx / dist : -lastMoveDir.turn;
                const pushZ = dist > 0.001 ? dz / dist : lastMoveDir.forward;
                const pushAmount = blockRadius - Math.max(dist, 0.001);
                characterGroup.position.x += pushX * pushAmount;
                characterGroup.position.z += pushZ * pushAmount;
            });
        };

        const resolveEnemyEnemyCollision = () => {
            const defaultEnemyBlockRadius = activeGhostType.separationRadius;
            for (let i = 0; i < enemies.length; i++) {
                for (let j = i + 1; j < enemies.length; j++) {
                    const a = enemies[i].group;
                    const b = enemies[j].group;
                    const dx = a.position.x - b.position.x;
                    const dz = a.position.z - b.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    const enemyBlockRadius = Math.max(enemies[i].type?.separationRadius || defaultEnemyBlockRadius, enemies[j].type?.separationRadius || defaultEnemyBlockRadius);
                    if (dist >= enemyBlockRadius) continue;

                    const nx = dist > 0.001 ? dx / dist : 1;
                    const nz = dist > 0.001 ? dz / dist : 0;
                    const push = (enemyBlockRadius - Math.max(dist, 0.001)) * 0.5;
                    a.position.x += nx * push;
                    a.position.z += nz * push;
                    b.position.x -= nx * push;
                    b.position.z -= nz * push;
                }
            }
        };
        const triggerSlash = (e) => {
            e.preventDefault();
            if (slashRecoveryTimer > 0) return;
            updateLastMoveDir();
            const slashDir = getSlashWorldDirection();
            comboStep = comboTimer > 0 ? (comboStep % 3) + 1 : 1;
            comboTimer = comboResetTime;
            slashRecoveryTimer = slashRecoveryTime;
            slashPoseTimer = slashPoseDuration;
            slashPoseDir = slashDir;
            triggerSlashVfx(comboStep, slashDir);

            const slashRange = comboStep === 3 ? 2.05 : 1.72;
            const slashHalfAngle = Math.cos(THREE.MathUtils.degToRad(comboStep === 3 ? 46 : 36));
            const slashDamage = comboStep === 3 ? 2 : 1;
            const knockbackPower = comboStep === 3 ? 5.8 : 3.8;
            const closeSlashRadius = 0.72;

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const dx = enemy.group.position.x - characterGroup.position.x;
                const dz = enemy.group.position.z - characterGroup.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist <= 0 || dist > slashRange) continue;

                const dot = (dx / dist) * slashDir.x + (dz / dist) * slashDir.z;
                if (dist <= closeSlashRadius || dot >= slashHalfAngle) {
                    damageEnemy(enemy, i, slashDir, slashDamage, knockbackPower);
                }
            }
        };

        dashBtn.addEventListener('touchstart', triggerDash, { passive: false });
        dashBtn.addEventListener('mousedown', triggerDash);
        slashBtn.addEventListener('touchstart', triggerSlash, { passive: false });
        slashBtn.addEventListener('mousedown', triggerSlash);

        // --- 6. Game Loop ---
        const clock = new THREE.Clock();
        const moveSpeed = 5; // units per second
        const cameraHeight = 18.7;
        const cameraBackDistance = 13.2;
        const cameraLookAhead = 2.0;
        let screenShakeTimer = 0;
        let screenShakeDuration = 0;
        let screenShakeStrength = 0;

        const triggerScreenShake = (strength = 0.12, duration = 0.1) => {
            screenShakeStrength = Math.max(screenShakeStrength, strength);
            screenShakeDuration = Math.max(screenShakeDuration, duration);
            screenShakeTimer = Math.max(screenShakeTimer, duration);
        };

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            comboTimer = Math.max(0, comboTimer - dt);
            slashRecoveryTimer = Math.max(0, slashRecoveryTimer - dt);
            
            // --- Player Movement ---
            let currentSpeed = (isMapOpen || isTransitioning) ? 0 : (slashRecoveryTimer > 0 ? moveSpeed * 0.62 : moveSpeed);
            if (isDashing) {
                dashTimer -= dt;
                if (dashTimer <= 0) isDashing = false;
                else currentSpeed = moveSpeed * 2.8;
            } else {
                updateLastMoveDir();
            }

            if (isDashing) {
                characterGroup.position.x += lastMoveDir.turn * currentSpeed * dt;
                characterGroup.position.z -= lastMoveDir.forward * currentSpeed * dt;
            } else if (moveData.forward !== 0 || moveData.turn !== 0) {
                characterGroup.position.x += moveData.turn * currentSpeed * dt;
                characterGroup.position.z -= moveData.forward * currentSpeed * dt;
            }

            constrainPlayerToHomeGround();
            resolvePlayerEnemyCollision();
            constrainPlayerToHomeGround();

            if (!isMapOpen && activeArea === 'basement' && isPointInsideRect(characterGroup.position, areaConfigs.basement.nextAreaCollider)) {
                transitionToArea('lobby');
            }

            if (activeArea === 'lobby') {
                const isInsideMapTrigger = isPointInsideRect(characterGroup.position, areaConfigs.lobby.mapCollider);
                if (!isInsideMapTrigger) mapTriggerArmed = true;
                if (!isMapOpen && mapTriggerArmed && isInsideMapTrigger) openMap();
                if (!isMapOpen && isPointInsideRect(characterGroup.position, areaConfigs.lobby.basementCollider)) transitionToArea('basement');
            }

            if (activeArea === 'shop' || activeArea === 'circus') {
                const isInsideAreaMapTrigger = isPointInsideRect(characterGroup.position, areaConfigs[activeArea].mapCollider);
                if (!isInsideAreaMapTrigger) mapTriggerArmed = true;
                if (!isMapOpen && mapTriggerArmed && isInsideAreaMapTrigger) openMap();
            }

            const horizontalIntent = isDashing ? lastMoveDir.turn : moveData.turn;
            if (horizontalIntent > 0.05) characterFacing = 1;
            if (horizontalIntent < -0.05) characterFacing = -1;

            soulAnimTime += dt;
            slashPoseTimer = Math.max(0, slashPoseTimer - dt);
            const isMoving = Math.abs(moveData.forward) > 0.05 || Math.abs(moveData.turn) > 0.05 || isDashing;
            const wobbleSpeed = isMoving ? 10 : 5.5;
            const wobble = Math.sin(soulAnimTime * wobbleSpeed);
            const slashPoseProgress = slashPoseTimer > 0 ? 1 - slashPoseTimer / slashPoseDuration : 1;
            const slashPoseStrength = slashPoseTimer > 0 ? Math.sin(slashPoseProgress * Math.PI) : 0;
            const soulTilt = wobble * (isMoving ? 0.012 : 0.007);
            const slashTilt = slashPoseStrength * (0.045 * characterFacing + slashPoseDir.x * 0.018);

            character.position.set(
                0,
                1 + wobble * (isMoving ? 0.012 : 0.007) + slashPoseStrength * 0.025,
                0
            );
            character.scale.x = characterFacing * (1 + slashPoseStrength * 0.025);
            character.scale.y = 1 + wobble * 0.01 + slashPoseStrength * 0.02;

            character.quaternion.copy(camera.quaternion);
            character.rotateZ(soulTilt + slashTilt);
            updateSlashVfx(dt);
            // --- Enemy AI & Spawning ---
            if (activeArea === 'basement' && baseHealth > 0 && soulHealth > 0) {
                enemySpawnTimer += dt;
                if (enemySpawnTimer >= enemySpawnInterval && totalEnemiesSpawned < maxEnemies) {
                    spawnEnemy();
                    totalEnemiesSpawned++;
                    enemySpawnTimer = 0;
                }


                resolveEnemyEnemyCollision();

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    enemy.age += dt;
                    const ex = enemy.group.position.x;
                    const ez = enemy.group.position.z;
                    const ritualTarget = areaConfigs.basement.ritualCenter;
                    const toRitualX = ex - ritualTarget.x;
                    const toRitualZ = ez - ritualTarget.z;
                    const distToCenter = Math.sqrt(toRitualX * toRitualX + toRitualZ * toRitualZ);
                    const attackTarget = enemy.type.attackTarget || 'ritual';
                    const targetX = attackTarget === 'player' ? characterGroup.position.x : ritualTarget.x;
                    const targetZ = attackTarget === 'player' ? characterGroup.position.z : ritualTarget.z;
                    const toTargetX = ex - targetX;
                    const toTargetZ = ez - targetZ;
                    const distToTarget = Math.sqrt(toTargetX * toTargetX + toTargetZ * toTargetZ);
                    const enterRadius = attackTarget === 'player' ? enemy.type.playerAttackRadius : enemy.type.ritualEnterRadius;
                    const cancelRadius = attackTarget === 'player' ? enemy.type.playerCancelRadius : enemy.type.ritualCancelRadius;
                    const toPlayerX = ex - characterGroup.position.x;
                    const toPlayerZ = ez - characterGroup.position.z;
                    const distToPlayer = Math.sqrt(toPlayerX * toPlayerX + toPlayerZ * toPlayerZ);
                    enemy.areaCooldownTimer = Math.max(0, enemy.areaCooldownTimer - dt);
                    if (enemy.areaTelegraph) enemy.areaTelegraph.visible = false;

                    enemy.mesh.quaternion.copy(camera.quaternion);

                    if (enemy.state === 'playerAreaWindup') {
                        enemy.areaWindupTimer -= dt;
                        enemy.mesh.material.color.setHex(0xff5b70);
                        const areaRadius = enemy.type.playerAreaDamageRadius || 1.5;
                        if (enemy.areaTelegraph) {
                            const progress = 1 - Math.max(0, enemy.areaWindupTimer) / enemy.type.playerAreaWindupTime;
                            enemy.areaTelegraph.visible = true;
                            enemy.areaTelegraph.scale.setScalar(areaRadius * (0.82 + progress * 0.18));
                            enemy.areaTelegraph.material.opacity = 0.16 + Math.sin(enemy.age * 36) * 0.05;
                        }
                        const pulse = 1 + Math.sin(enemy.age * 40) * 0.08;
                        setEnemyVisualScale(enemy, pulse);
                        if (enemy.areaWindupTimer <= 0) {
                            if (distToPlayer <= areaRadius) {
                                soulHealth -= enemy.type.soulDamage || 10;
                                updateHealthDisplays();
                                triggerScreenShake(0.34, 0.16);
                                createHitBurst(characterGroup.position);
                            }
                            enemy.areaCooldownTimer = enemy.type.playerAreaCooldownTime || 2;
                            enemy.state = 'chase';
                            enemy.mesh.material.color.setHex(0xffffff);
                            setEnemyVisualScale(enemy, 1);
                            if (enemy.areaTelegraph) enemy.areaTelegraph.visible = false;
                        }
                        continue;
                    }
                    if (enemy.stunTimer > 0) {
                        enemy.stunTimer -= dt;
                        enemy.group.position.x += enemy.knockback.x * dt;
                        enemy.group.position.z += enemy.knockback.z * dt;
                        const damp = Math.max(0, 1 - dt * 5.5);
                        enemy.knockback.x *= damp;
                        enemy.knockback.z *= damp;
                        enemy.mesh.material.color.setHex(0xffffff);
                        continue;
                    }

                    if (enemy.state === 'chase' && enemy.type.playerAreaTriggerRadius && enemy.areaCooldownTimer <= 0 && distToPlayer < enemy.type.playerAreaTriggerRadius) {
                        enemy.state = 'playerAreaWindup';
                        enemy.areaWindupTimer = enemy.type.playerAreaWindupTime || 0.65;
                        enemy.mesh.material.color.setHex(0xff9a9a);
                        continue;
                    }
                    if (enemy.state === 'windup') {
                        if (distToTarget > cancelRadius) {
                            enemy.state = 'chase';
                            enemy.mesh.material.color.setHex(0xffffff);
                            setEnemyVisualScale(enemy, 1);
                            continue;
                        }
                        enemy.windupTimer -= dt;
                        enemy.mesh.material.color.setHex(0xff9a9a);
                        const pulse = 1 + Math.sin(enemy.windupTimer * 45) * 0.08;
                        setEnemyVisualScale(enemy, pulse);
                        if (enemy.windupTimer <= 0) {
                            if (attackTarget === 'player') {
                                soulHealth -= enemy.type.soulDamage || 8;
                                updateHealthDisplays();
                                triggerScreenShake(0.24, 0.13);
                            } else {
                                baseHealth -= enemy.type.ritualDamage;
                                updateHealthDisplays();
                                triggerScreenShake(0.28, 0.14);
                                enemy.ritualHits++;
                                if (enemy.type.maxRitualHits && enemy.ritualHits >= enemy.type.maxRitualHits) {
                                    createHitBurst(enemy.group.position);
                                    destroyEnemy(enemy, i, false);
                                    continue;
                                }
                            }
                            enemy.state = 'cooldown';
                            enemy.attackCooldownTimer = enemy.type.cooldownTime;
                            enemy.mesh.material.color.setHex(0xff5b70);
                            setEnemyVisualScale(enemy, 1);
                        }
                        continue;
                    }

                    if (enemy.state === 'cooldown') {
                        enemy.attackCooldownTimer -= dt;
                        enemy.mesh.material.color.setHex(0xbb6d88);
                        if (distToTarget > cancelRadius) {
                            enemy.state = 'chase';
                        } else if (enemy.attackCooldownTimer <= 0) {
                            enemy.state = 'windup';
                            enemy.windupTimer = enemy.type.windupTime;
                        }
                        continue;
                    }
                    enemy.mesh.material.color.setHex(0xffffff);
                    setEnemyVisualScale(enemy, 1);
                    if (distToTarget < enterRadius) {
                        enemy.state = 'windup';
                        enemy.windupTimer = enemy.type.windupTime;
                        enemy.attackTimer = 0;
                    } else if (distToTarget > 0) {
                        const directX = -(toTargetX / distToTarget);
                        const directZ = -(toTargetZ / distToTarget);
                        const weaveAmplitude = enemy.type.zigzagAmplitude || 0;
                        const weaveFrequency = enemy.type.zigzagFrequency || 0;
                        const weaveTime = enemy.age * weaveFrequency + enemy.zigzagPhase;
                        const weavePhase = ((weaveTime / (Math.PI * 2)) % 1 + 1) % 1;
                        const sharpWeave = weavePhase < 0.5 ? -1 : 1;
                        const turnBlend = Math.min(1, Math.abs(weavePhase - 0.5) * 10 + 0.35);
                        const weave = sharpWeave * weaveAmplitude * turnBlend;
                        let moveX = directX + (-directZ) * weave;
                        let moveZ = directZ + directX * weave;
                        const moveMag = Math.sqrt(moveX * moveX + moveZ * moveZ);
                        if (moveMag > 0) {
                            moveX /= moveMag;
                            moveZ /= moveMag;
                        }

                        if (!enemy.type.rotateToMove && Math.abs(moveX) > 0.05) {
                            enemy.facing = moveX < 0 ? -1 : 1;
                        }
                        setEnemyVisualScale(enemy, 1);
                        if (enemy.type.rotateToMove) {
                            enemy.mesh.rotation.z = Math.atan2(-moveZ, moveX) + (enemy.type.travelRotationOffset || 0);
                        }
                        enemy.group.position.x += moveX * enemy.type.speed * dt;
                        enemy.group.position.z += moveZ * enemy.type.speed * dt;
                    }
                }
            } else if (activeArea === 'basement') {
                if (baseHealth <= 0) {
                    baseHealthDisplay.innerText = "Base Destroyed! Game Over.";
                    baseHealthDisplay.style.color = "red";
                }
                if (soulHealth <= 0) {
                    soulHealthDisplay.innerText = "Soul Faded! Night Failed.";
                    soulHealthDisplay.style.color = "#ff7070";
                }
            }
            let shakeX = 0;
            let shakeZ = 0;
            if (screenShakeTimer > 0) {
                screenShakeTimer = Math.max(0, screenShakeTimer - dt);
                const shakeFalloff = screenShakeDuration > 0 ? screenShakeTimer / screenShakeDuration : 0;
                const shakeAmount = screenShakeStrength * shakeFalloff * shakeFalloff;
                shakeX = (Math.random() * 2 - 1) * shakeAmount;
                shakeZ = (Math.random() * 2 - 1) * shakeAmount;
                if (screenShakeTimer <= 0) {
                    screenShakeStrength = 0;
                    screenShakeDuration = 0;
                }
            }

            // Frame the player lower on screen and keep more of the ritual area visible ahead.
            camera.position.x = characterGroup.position.x + shakeX;
            camera.position.z = characterGroup.position.z + cameraBackDistance + shakeZ;
            camera.position.y = cameraHeight;
            camera.lookAt(
                characterGroup.position.x + shakeX * 0.35,
                0,
                characterGroup.position.z - cameraLookAhead + shakeZ * 0.35
            );
            renderer.render(scene, camera);
        }

        animate();

        // --- 7. Window Resize Handling ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.fov = getAdaptiveCameraFov();
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            scene.background = createBackgroundTexture(activeArea);
        });
    </script>
</body>
</html>
